<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ab workout timer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--line:#d6d4cd;--card:#f5f4f0;--acc:#D85A30;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#f0eee8;--muted:#a09e96;--line:#3a3a37;--card:#262624}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#f0eee8;--muted:#a09e96;--line:#3a3a37;--card:#262624}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:420px;margin:0 auto;padding:24px 16px 32px;text-align:center}
section[hidden]{display:none}
h1{font-size:22px;font-weight:500;margin:8px 0}
h2{font-size:20px;font-weight:500;margin:4px 0 0}
.m{color:var(--muted);margin:4px 0 12px}
button,input{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 18px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;width:100%;padding:14px;font-size:18px;margin-top:12px}
.chips{display:flex;gap:8px;justify-content:center;margin:12px 0}
input[type=number]{width:80px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:18px}
label{display:block;margin:10px 0}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
svg{width:100%;height:auto;display:block}
.lab{font-size:18px;color:var(--muted);margin-top:12px}
.num{font-size:96px;line-height:1.1;font-weight:500;font-variant-numeric:tabular-nums}
.num.end{color:var(--acc)}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px}
svg line,svg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.p{stroke:var(--fg)}.s{stroke:var(--muted)}.fl{stroke:var(--line);stroke-width:1}.gd{stroke:var(--muted)}
.hd{fill:var(--card);stroke:var(--fg);stroke-width:3}.ab{fill:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.grid .card{padding:6px}
.grid h3{font-size:14px;font-weight:500;margin:4px 0 0}
.grid p{font-size:12px;color:var(--muted);margin:0 0 4px}
.paused *,.sw *{animation-play-state:paused!important}
.restring{transform-origin:190px 120px;animation:restspin var(--d,30s) linear infinite}
@keyframes restspin{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
.iwA{transform-origin:280px 196px;animation:iwA 6s ease-in-out infinite}
.iwB{transform-origin:240px 116px;animation:iwB 6s ease-in-out infinite}
.iwC{transform-origin:214px 166px;animation:iwC 6s ease-in-out infinite}
@keyframes iwA{0%,8%{transform:rotate(0deg)}35%,45%{transform:rotate(-51deg)}65%{transform:rotate(0deg)}85%,95%{transform:rotate(26.6deg)}100%{transform:rotate(0deg)}}
@keyframes iwB{0%,8%{transform:rotate(0deg)}35%,45%{transform:rotate(125.5deg)}65%{transform:rotate(0deg)}85%,95%{transform:rotate(126deg)}100%{transform:rotate(0deg)}}
@keyframes iwC{0%,8%{transform:rotate(0deg)}35%,45%{transform:rotate(-74.5deg)}65%{transform:rotate(0deg)}85%,95%{transform:rotate(-152.5deg)}100%{transform:rotate(0deg)}}
.r{transform-origin:var(--o);animation:rot var(--d,3s) ease-in-out infinite}
.gl{animation:gl var(--d,3s) ease-in-out infinite}
@keyframes rot{0%,10%{transform:rotate(var(--a,0deg))}45%,55%{transform:rotate(var(--b,0deg))}90%,100%{transform:rotate(var(--a,0deg))}}
@keyframes gl{0%,10%{opacity:.25}45%,55%{opacity:.9}90%,100%{opacity:.25}}
.cr{transform-origin:206px 194px;animation:cr 3.6s ease-in-out infinite}
.cg{animation:cg 3.6s ease-in-out infinite}
@keyframes cr{0%,8%{transform:rotate(0)}40%,55%{transform:rotate(38deg)}92%,100%{transform:rotate(0)}}
@keyframes cg{0%,8%{opacity:.2}40%,55%{opacity:.9}92%,100%{opacity:.2}}
.pg{animation:pl 2.4s ease-in-out infinite}
.gd{stroke-dasharray:6 6;animation:fl 1.2s linear infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes fl{to{stroke-dashoffset:-12}}
.t1,.t2{transform-origin:206px 194px;animation:th 2.4s ease-in-out infinite}
.k1,.k2{transform-origin:261px 194px;animation:kn 2.4s ease-in-out infinite}
.t2,.k2{animation-delay:-1.2s}
.bt{transform-origin:206px 194px;animation:tw 1.2s ease-in-out infinite}
.bg{animation:bgl 1.2s ease-in-out infinite}
@keyframes th{0%,100%{transform:rotate(-65deg)}50%{transform:rotate(-18deg)}}
@keyframes kn{0%,100%{transform:rotate(70deg)}50%{transform:rotate(0)}}
@keyframes tw{0%,100%{transform:rotate(28deg)}50%{transform:rotate(34deg)}}
@keyframes bgl{0%,100%{opacity:.35}50%{opacity:.9}}
.lg{transform-origin:180px 194px;animation:lr 4s ease-in-out infinite}
.lgl{animation:lrg 4s ease-in-out infinite}
@keyframes lr{0%,8%{transform:rotate(-6deg)}45%,55%{transform:rotate(-88deg)}92%,100%{transform:rotate(-6deg)}}
@keyframes lrg{0%,8%{opacity:.25}45%,55%{opacity:.9}92%,100%{opacity:.25}}
.ar{transform-origin:190px 144px;animation:sw 3s ease-in-out infinite}
.sb{transform-origin:190px 144px;animation:sq 3s ease-in-out infinite}
.oa{animation:oa 3s ease-in-out infinite}.ob{animation:ob 3s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}
@keyframes sq{0%,50%,100%{transform:scaleX(.7)}25%,75%{transform:scaleX(1)}}
@keyframes oa{0%,100%{opacity:.9}50%{opacity:.2}}
@keyframes ob{0%,100%{opacity:.2}50%{opacity:.9}}
</style>
</head>
<body>
<main>
<section id="setup">
<h1>Ab workout timer</h1>
<p class="m">How long do you want to exercise?</p>
<div class="chips" id="chips"><button>5</button><button>10</button><button>15</button><button>20</button></div>
<label>Minutes <input id="mins" type="number" min="1" max="120" value="10" inputmode="numeric"></label>
<label>Final plank hold (seconds) <input id="pd" type="number" min="10" max="600" value="60" inputmode="numeric"></label>
<p class="m" id="sum"></p>
<label><input type="checkbox" id="snd" checked> Sound</label>
<button class="pri" id="go">Start</button>
<button id="lb" style="width:100%;margin-top:10px;padding:12px">Exercise library</button>
</section>
<section id="run" hidden>
<div class="top"><span id="cnt"></span><span id="nxt"></span></div>
<div class="bar"><i id="fill"></i></div>
<div class="card" id="stage"><div id="art"></div></div>
<div class="lab" id="lab"></div>
<div class="num" id="num">3</div>
<h2 id="nm"></h2>
<p class="m" id="cue"></p>
<div class="row"><button id="pz">Pause</button><button id="sk">Skip</button><button id="st">Stop</button></div>
</section>
<section id="lib" hidden>
<h1>Exercise library</h1>
<p class="m" id="lcount"></p>
<div class="grid" id="grid"></div>
<button class="pri" id="lback">Back</button>
</section>
<section id="done" hidden>
<h1>Workout complete</h1>
<p class="m" id="sum2"></p>
<button class="pri" id="again">Go again</button>
</section>
</main>
<script>
const L=(a,b,c,d,k='p',w=7)=>`<line class="${k}" stroke-width="${w}" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
const P=(pts,k='p',w=7)=>`<polyline class="${k}" stroke-width="${w}" points="${pts}"/>`;
const HD=(x,y,r=9)=>`<circle class="hd" cx="${x}" cy="${y}" r="${r}"/>`;
const AB=(x,y,rx=26,ry=5,t='',st='')=>`<ellipse class="ab gl" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="${t}" style="${st}"/>`;
const R=(x,y,a,b,inner,st='')=>`<g class="r" style="--o:${x}px ${y}px;--a:${a}deg;--b:${b}deg;${st}">${inner}</g>`;
const LT=L(206,194,116,194,'p',8)+HD(96,192)+AB(170,194);
const F2='<line class="fl" x1="60" y1="230" x2="320" y2="230"/>';
const DB=(k,arm,st='')=>R(206,194,0,70,L(206,194,206,140,k)+R(206,140,0,-90,L(206,140,256,140,k),st),st)+R(126,192,0,-65,L(126,192,126,132,arm,5),st);
const FL='<line class="fl" x1="50" y1="202" x2="340" y2="202"/>';
const PLANK={n:"Plank",c:"One straight line, glutes tight",s:FL+'<line class="gd" stroke-width="1.5" x1="87" y1="116" x2="307" y2="165"/><polyline class="s" stroke-width="6" points="68,194 110,194 112,152"/><polyline class="p" stroke-width="8" points="112,152 290,192 293,197"/><ellipse class="ab pg" cx="175" cy="166" rx="28" ry="5" transform="rotate(12.7 175 166)"/><circle class="hd" cx="93" cy="148" r="9"/>'};
const REST='<svg viewBox="0 0 380 240" role="img" aria-label="Rest"><circle cx="190" cy="120" r="46" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="190" cy="120" r="46" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="289" class="restring"/><text x="190" y="128" text-anchor="middle" font-size="20" fill="var(--muted)">Rest</text></svg>';
const E=[
{n:"Crunch",c:"Lift shoulders a few inches, exhale on the way up",s:FL+'<polyline class="p" stroke-width="7" points="206,194 258,146 280,194 294,194"/><g class="cr"><line class="p" stroke-width="8" x1="206" y1="194" x2="116" y2="194"/><ellipse class="ab cg" cx="170" cy="194" rx="26" ry="5"/><circle class="hd" cx="96" cy="192" r="9"/><polyline class="s" stroke-width="5" points="126,192 108,170 96,186"/></g>'},
{n:"Bicycle crunch",c:"Elbow to opposite knee, go slow",s:FL+'<g class="t2"><line class="s" stroke-width="7" x1="206" y1="194" x2="261" y2="194"/><g class="k2"><line class="s" stroke-width="7" x1="261" y1="194" x2="316" y2="194"/></g></g><g class="t1"><line class="p" stroke-width="7" x1="206" y1="194" x2="261" y2="194"/><g class="k1"><line class="p" stroke-width="7" x1="261" y1="194" x2="316" y2="194"/></g></g><g class="bt"><line class="p" stroke-width="8" x1="206" y1="194" x2="116" y2="194"/><ellipse class="ab bg" cx="170" cy="194" rx="26" ry="5"/><circle class="hd" cx="96" cy="192" r="9"/><polyline class="s" stroke-width="5" points="126,192 108,170 96,186"/></g>'},
{n:"Leg raise",c:"Keep your lower back pressed into the floor",s:'<line class="fl" x1="30" y1="202" x2="350" y2="202"/><line class="p" stroke-width="8" x1="180" y1="194" x2="90" y2="194"/><ellipse class="ab lgl" cx="155" cy="194" rx="24" ry="5"/><circle class="hd" cx="70" cy="192" r="9"/><g class="lg"><polyline class="p" stroke-width="7" points="180,194 300,194 302,183"/></g>'},
{n:"Russian twist",c:"Feet up, chest tall, rotate the ribcage",s:'<line class="fl" x1="60" y1="230" x2="320" y2="230"/><polyline class="p" stroke-width="7" points="172,216 166,192 190,222 214,192 208,216"/><line class="p" stroke-width="8" x1="190" y1="222" x2="190" y2="144"/><ellipse class="ab oa" cx="176" cy="172" rx="6" ry="14"/><ellipse class="ab ob" cx="204" cy="172" rx="6" ry="14"/><g class="sb"><line class="p" stroke-width="7" x1="162" y1="144" x2="218" y2="144"/></g><circle class="hd" cx="190" cy="126" r="10"/><g class="ar"><circle cx="190" cy="186" r="7" style="fill:var(--muted)"/></g>'},
{n:"V-up",c:"Legs and torso rise together into a V",s:FL+R(206,194,0,55,LT)+R(206,194,0,-55,L(206,194,316,194))},
{n:"Side plank leg raise",sw:1,c:"Hips high, lift the top leg. Switch sides halfway",s:FL+P('112,196 150,196 150,148','s',6)+R(225,172,0,-30,L(225,172,300,196,'s'))+P('150,148 225,172 300,196','p',8)+HD(131,142)+AB(188,160,26,5,'rotate(17.7 188 160)')},
{n:"Situp",c:"Curl all the way up, lower with control",d:"3.6s",s:FL+P('206,194 258,146 280,194 294,194')+R(206,194,0,80,LT+P('126,192 108,170 96,186','s',5))},
{n:"Reverse curl",c:"Curl knees to chest and lift hips off the floor",s:FL+HD(96,192)+R(116,194,0,-7,L(206,194,116,194,'p',8)+AB(170,194)+R(206,194,0,-40,P('206,194 236,142 296,150')))},
{n:"Bird dog",c:"Extend the front leg and back leg together, then switch to the other side",d:"4s",s:FL+L(120,140,240,140,'p',8)+HD(100,156)+AB(180,140,30)+R(120,140,0,100,L(120,140,120,194,'s',6))+R(240,140,0,-100,L(240,140,240,194,'p',6))+R(120,140,0,100,L(120,140,120,194,'p',6),'animation-delay:-2s')+R(240,140,0,-100,L(240,140,240,194,'s',6),'animation-delay:-2s')},
{n:"Superman",c:"Lift arms, chest and legs together",s:FL+R(206,194,0,12,L(206,194,150,194,'p',8)+L(150,192,76,192,'s',5)+HD(136,186)+AB(185,194,18))+R(206,194,0,-14,L(206,194,316,194))},
{n:"Swimmer",c:"Flutter opposite arm and leg, chest lifted",d:"2s",s:FL+L(206,194,150,194,'p',8)+AB(185,194,18)+R(150,192,0,16,L(150,192,76,192,'s',5))+R(206,194,0,-16,L(206,194,316,194,'p'))+R(150,192,0,16,L(150,192,76,192,'p',5),'animation-delay:-1s')+R(206,194,0,-16,L(206,194,316,194,'s'),'animation-delay:-1s')+HD(136,186)},
{n:"Windmill",c:"Reach to the opposite foot, other arm up",d:"4s",s:F2+P('122,228 190,150 258,228')+R(190,150,-120,120,L(190,150,190,84,'p',8)+L(150,84,230,84,'s',5)+HD(190,70)+AB(190,118,5,16))},
{n:"Inchworm",c:"Walk hands out to plank, walk back, then stand up fully",s:FL+'<g class="iwA">'+L(280,196,240,116,'p',8)+'<g class="iwB">'+L(240,116,214,166,'p',8)+HD(206,180)+'<g class="iwC">'+L(214,166,214,196,'s',6)+'</g></g></g>'},
{n:"Flutter kicks",c:"Small fast kicks, lower back pressed down",d:"1.2s",s:FL+LT+R(206,194,-8,-32,L(206,194,316,194,'s'))+R(206,194,-8,-32,L(206,194,316,194),'animation-delay:-.6s')},
{n:"Side reaches",c:"Knees bent, reach to touch each side of your feet",s:P('158,196 172,176 190,168 208,176 222,196')+L(150,198,166,198,'p',6)+L(214,198,230,198,'p',6)+R(190,168,-24,24,L(190,168,190,98,'p',8)+L(164,100,216,100,'p',7)+L(164,100,146,160,'s',5)+L(216,100,234,160,'s',5)+HD(190,80)+AB(178,140,5,16)+AB(202,140,5,16,'','animation-delay:-1.5s'))},
{n:"Toe reaches",c:"Legs vertical, reach hands to your toes",s:FL+P('206,194 206,84 218,84')+R(206,194,0,42,LT+L(126,192,126,127,'s',5))},
{n:"Dead bug",c:"Opposite arm and leg, back flat",d:"4s",s:FL+LT+DB('p','s')+DB('s','p','animation-delay:-2s')},
{n:"6 inches and hold",c:"Legs straight, heels a few inches off the floor",s:FL+L(180,194,90,194,'p',8)+HD(70,192)+L(180,194,300,188,'p',7)+AB(155,194,24,5)},
{n:"The 100",c:"Pulse straight arms from the shoulder, small fast pumps",s:FL+R(206,194,30,30,LT+L(160,194,215,185,'p',5)+R(215,185,-10,10,L(215,185,255,178,'p',4),'--d:0.6s'))+R(206,194,-16,-16,L(206,194,306,182))},
{n:"Scissor Kicks",c:"Straight legs, small fast alternating scissors",d:"1.6s",s:FL+LT+R(206,194,-15,-60,L(206,194,316,194,'s'))+R(206,194,-15,-60,L(206,194,316,194),'animation-delay:-.8s')},
{n:"In and Out Abs",c:"Hug your knees to your chest, then extend legs and torso out",d:"2.4s",s:FL+R(206,194,20,20,LT)+R(206,194,-65,-18,L(206,194,261,194,'p',7)+R(261,194,70,0,L(261,194,316,194,'p',7)))},
{n:"Wipers",c:"Knees bent, rotate your legs side to side, arms out for balance",d:"3.2s",s:HD(190,40)+L(110,80,270,80,'s',6)+L(190,80,190,150,'p',8)+AB(190,115,14,35)+L(170,150,210,150,'p',7)+R(190,150,-32,32,P('190,150 172,205 190,228 208,205 190,150','p',6))},
{n:"Hollow Hold",c:"Lower back pressed down, arms and legs extended, banana shape",s:P('50,150 100,182 230,196 320,165')+HD(112,178,8)+AB(175,194,30,5)},
{n:"Side Plank",sw:1,c:"Straight line from head to feet, hips lifted. Switch sides halfway",s:'<line class="fl" x1="60" y1="198" x2="320" y2="198"/>'+P('112,196 150,196 150,148','s',6)+L(225,172,300,196,'s',6)+P('150,148 225,172 300,196','p',8)+HD(131,142)+AB(188,160,26,5,'rotate(17.7 188 160)')},
{n:"V Situp and Hold",c:"Balance on your sit bones, torso and legs in a V",s:FL+R(206,194,55,55,LT)+R(206,194,-55,-55,L(206,194,316,194))}
];
const GR=5,SWP=5,S=GR+30,B=30,W=165,$=id=>document.getElementById(id);
let T,t0,off,pz,ss,sg,wk,n0,q,pv,nq,tm,ac,last,cur,PD,plankDone;
const svg=(s,d)=>'<svg viewBox="0 0 380 240" role="img" aria-label="Exercise animation" style="--d:'+(d||'3s')+'">'+s+'</svg>';
const show=id=>['setup','run','done','lib'].forEach(x=>$(x).hidden=x!==id);
const f=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clk=()=>((pz||Date.now())-t0-off)/1000;
function beep(fr,d){
  if(!$('snd').checked)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=fr;g.gain.value=.15;o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function announce(text){
  if(!$('snd').checked)return;
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function mins(){return Math.min(120,Math.max(1,parseFloat($('mins').value)||10))}
function plankSecs(){return Math.min(600,Math.max(5,parseInt($('pd').value)||60))}
function plan(t){let s=0,w=0,x=0,b=0;for(;;){const r=t-s;if(w>=W&&r>=S+B){s+=B;w=0;b++}else if(r>=S){s+=S;w+=S;x++}else return[x,b]}}
function sum(){const m=mins(),p=plan(m*60);$('sum').textContent=m+' min = about '+p[0]+' exercises and '+p[1]+' breaks (30s each), plus a plank to finish'}
function draw(){
  if(!q.length){
    q=E.map((_,i)=>i);
    for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
    if(q[q.length-1]===pv){[q[0],q[q.length-1]]=[q[q.length-1],q[0]]}
  }
  return pv=q.pop();
}
function go(at){
  if(!sg){sg={k:'intro',d:GR};ss=0;cur=null;last='';return true}
  if(sg.k==='intro'){
    off+=sg.d*1000;
    nq=draw();
    sg={k:'x',d:E[nq].sw?S+SWP:S,e:nq};nq=draw();n0++;
    ss=0;cur=null;last='';return true;
  }
  const r=T-at;
  if(sg.k==='x')wk+=(at-ss);else if(sg.k==='b')wk=0;
  if(wk>=W&&r>=S+B)sg={k:'b',d:B,e:nq};
  else if(r>=(E[nq].sw?S+SWP:S)){sg={k:'x',d:E[nq].sw?S+SWP:S,e:nq};nq=draw();n0++}
  else if(!plankDone){plankDone=true;sg={k:'pl',d:PD}}
  else return false;
  ss=at;cur=null;last='';return true;
}
function start(){
  T=mins()*60;PD=plankSecs();plankDone=false;
  t0=Date.now();off=0;pz=0;ss=0;wk=0;n0=0;q=[];pv=-1;sg=null;cur=null;last='';
  go(0);
  $('pz').textContent='Pause';$('stage').classList.remove('paused');
  show('run');
  try{navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  clearInterval(tm);tm=setInterval(tick,200);tick();
}
function tick(force){
  if(pz&&force!==true)return;
  while(clk()>=ss+sg.d){if(!go(ss+sg.d))return done()}
  const el=clk();
  if(sg.k==='intro'){
    const wi=el-ss,ni=Math.ceil(sg.d-wi);
    if(cur!==sg){cur=sg;$('art').innerHTML='';$('nm').textContent='Get ready';$('cue').textContent='';$('cnt').textContent='Starting\u2026';$('nxt').textContent='';$('lab').textContent='Get ready';$('num').className='num';$('fill').style.width='0%';announce('Get ready')}
    $('num').textContent=ni;
    if(ni!==last){last=ni;beep(660,.12)}
    return;
  }
  const w=el-ss,b=sg.k==='b',pl=sg.k==='pl',e=pl?PLANK:E[sg.e],r=T-(ss+sg.d);
  if(cur!==sg){
    cur=sg;
    $('art').innerHTML=b?REST:svg(e.s,e.d);
    $('nm').textContent=b?'Break':e.n;
    announce(b?'Break':e.n);
  }
  if(pl){$('cnt').textContent='Final plank hold';$('nxt').textContent='';}
  else{
    $('cnt').textContent='Exercise '+n0+' \u00b7 '+f(T-el)+' left';
    $('nxt').textContent=b?'':r<S?'Last one, then a plank to finish':(wk+sg.d>=W&&r>=S+B)?'Next: Break':'Next: '+E[nq].n;
  }
  let n,ph;
  if(b){n=Math.ceil(B-w);ph=3}
  else if(w<GR){n=Math.ceil(GR-w);ph=0}
  else if(e.sw&&w<GR+15){n=Math.ceil((GR+15)-w);ph=1}
  else if(e.sw&&w<GR+15+SWP){n=Math.ceil((GR+15+SWP)-w);ph=4}
  else{n=Math.ceil(sg.d-w);ph=n<=3?2:1}
  $('num').textContent=n;
  $('num').className='num'+(ph===2||ph===4?' end':'');
  $('lab').textContent=['Get ready','Go','Finish strong','Break','Switch sides'][ph];
  $('cue').textContent=b?'Up next: '+e.n:ph===4?'Switch to your other side':e.c;
  $('stage').classList.toggle('sw',ph===4);
  $('fill').style.width=(pl?100:Math.min(100,el/T*100))+'%';
  const k=n0+'-'+(pl?'p':'x')+'-'+ph+'-'+n;
  if(k!==last){
    last=k;
    if(ph===3){if(n===B)beep(520,.4)}
    else if(ph===4){if(n===5)beep(520,.4)}
    else if(ph===1){if(n===(e.sw?15:Math.ceil(sg.d-GR))){beep(880,.35);announce('Begin')}}
    else if(ph===2){beep(440,n===1?.45:.12)}
    else beep(660,.12);
  }
}
function done(){
  clearInterval(tm);beep(880,.5);announce("You're done");
  $('sum2').textContent=n0+' exercises completed, plus a '+PD+'s plank';
  show('done');
}
$('sk').onclick=()=>{if(!go(clk()))done();else tick(true)};
$('lb').onclick=()=>{
  const all=E.concat([PLANK]);
  $('lcount').textContent=E.length+' exercises in the rotation, plus a final plank hold';
  $('grid').innerHTML=all.map(e=>'<div class="card">'+svg(e.s,e.d)+'<h3>'+e.n+'</h3><p>'+e.c+'</p></div>').join('');
  show('lib');window.scrollTo(0,0);
};
$('lback').onclick=()=>show('setup');
$('go').onclick=start;
$('again').onclick=()=>show('setup');
$('st').onclick=()=>{clearInterval(tm);show('setup')};
$('pz').onclick=()=>{
  if(pz){off+=Date.now()-pz;pz=0;$('pz').textContent='Pause'}
  else{pz=Date.now();$('pz').textContent='Resume'}
  $('stage').classList.toggle('paused',!!pz);
};
$('mins').oninput=sum;
$('chips').onclick=e=>{if(e.target.tagName==='BUTTON'){$('mins').value=e.target.textContent;sum()}};
sum();
</script>
